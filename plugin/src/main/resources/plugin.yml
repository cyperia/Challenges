name: Challenges
version: ${version}
author: cyperia
authors:
  - anweisen
  - DomiIRL
database: true
website: cyperia.net
# Kept below the supported version: an older server still loads the plugin, so it can tell
# joining players which version it needs (require.version below)
api-version: 1.14
main: net.cyperia.challenges.plugin.Challenges
load: POSTWORLD
softdepend:
  - CloudNet-Bridge
  - SpawneryAgent
  - ProtocolLib
description: |
  This plugin provides you with lots of challenges for beating minecraft or competing against your friends.
  You can find more information on our discord: https://discord.cyperia.net.

require:
  paper: true
  version: 26.3

# Every other node defaults to op, see ChallengesPermissions
permissions:
  challenges.command.help:
    default: true
  challenges.command.goal:
    default: true
  challenges.command.teams:
    default: true
  challenges.command.cancelinput:
    default: true
  challenges.command.position:
    default: true
  challenges.command.backpack:
    default: true
  challenges.command.top:
    default: true
  challenges.command.enderchest:
    default: true
  challenges.command.openmissingitems:
    default: true
  challenges.command.guess:
    default: true
